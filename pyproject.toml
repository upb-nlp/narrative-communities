[project]
name = "narrative-map"
version = "0.1.0"
description = "Data-driven communities for fake news prediction and narrative analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "datasets>=2.0.0",
    "dspy-ai>=3.1.3",
    "graphrag>=2.5.0",
    "httpx>=0.28.1",
    "lightgbm>=4.0.0",
    "nest-asyncio>=1.5.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "optuna>=3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative_map"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/prompts",
    "/configs",
    "/scripts",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
